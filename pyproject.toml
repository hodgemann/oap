[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-actor-protocol"
version = "0.3.1"
description = "Open Actor Protocol (OAP): cast, compensate, and protect AI actors across any compliant studio."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Maximum Goose Laboratory" }]
keywords = ["ai", "actors", "protocol", "casting", "generative-video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Video",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "Pillow>=10.0"]
images = ["Pillow>=10.0"]

[project.scripts]
oap = "oap.core:main"

[project.urls]
Homepage = "https://github.com/hodgemann/oap"

[tool.setuptools.packages.find]
include = ["oap*"]

[tool.setuptools.package-data]
oap = ["schemas/*.json"]
